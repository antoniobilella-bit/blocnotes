<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bloc-notes</title>
<meta name="application-name" content="Bloc-notes">
<meta name="apple-mobile-web-app-title" content="Bloc-notes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2D5A2A">
<meta name="description" content="Bloc-notes personale — note, scadenze, allegati">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --paper: #EEF2E5;
    --paper-2: #F6F8EE;
    --ink: #1B2517;
    --ink-2: #3E4B37;
    --ink-3: #7C8576;
    --line: #DCE2D2;
    --line-2: #C4CCB7;

    --lavoro: #1F4068;
    --personale: #B8860B;
    --viaggi: #0F766E;
    --medical: #8B2C0F;

    --accent: #2D5A2A;

    --urgent: #B8331C;
    --warning: #C77A0A;
    --ok: #3D6B36;

    --shadow-sm: 0 1px 2px rgba(27, 37, 23, 0.04), 0 1px 4px rgba(27, 37, 23, 0.04);
    --shadow-md: 0 4px 12px rgba(27, 37, 23, 0.06), 0 2px 4px rgba(27, 37, 23, 0.04);
    --shadow-lg: 0 16px 40px rgba(27, 37, 23, 0.12), 0 4px 12px rgba(27, 37, 23, 0.06);

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(45, 90, 42, 0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(60, 100, 50, 0.05), transparent 40%);
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 120px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 20px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .brand-title {
    font-family: var(--font-serif);
    font-size: 56px;
    line-height: 1;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .brand-title em { font-style: italic; color: var(--accent); }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat { text-align: right; }
  .stat-num {
    font-family: var(--font-serif);
    font-size: 32px;
    line-height: 1;
    font-weight: 400;
  }
  .stat-num.urgent { color: var(--urgent); }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: 4px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search { flex: 1; min-width: 220px; position: relative; }
  .search input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    background: var(--paper-2);
    border: 1px solid var(--line-2);
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    transition: all 0.15s;
  }
  .search input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .search::before {
    content: '⌕';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--ink-3);
  }
  .btn {
    padding: 12px 18px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent); border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: var(--paper); }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .chip {
    padding: 6px 14px;
    border: 1px solid var(--line-2);
    background: transparent;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-2);
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .chip-add { border-style: dashed; color: var(--ink-3); }
  .chip-add:hover {
    border-style: solid;
    color: var(--ink);
    border-color: var(--ink);
    background: var(--paper-2);
  }
  .filters-divider {
    width: 1px;
    height: 24px;
    background: var(--line-2);
    margin: 0 4px;
  }

  .notes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .note {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ink-3);
    padding: 18px 18px 14px;
    border-radius: 2px;
    transition: all 0.2s;
    position: relative;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    min-height: 140px;
  }
  .note:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--line-2);
  }
  .note.completed { opacity: 0.55; }
  .note.completed .note-title { text-decoration: line-through; }

  .note-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .note-cat {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    cursor: pointer;
    padding: 2px 6px;
    margin: -2px -6px;
    border-radius: 2px;
    transition: background 0.15s;
  }
  .note-cat:hover { background: var(--paper); }
  .note-cat::after {
    content: ' ▾';
    font-size: 8px;
    opacity: 0.5;
  }
  .note-priority { font-size: 14px; line-height: 1; }
  .note-title {
    font-family: var(--font-serif);
    font-size: 22px;
    line-height: 1.15;
    font-weight: 400;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .note-content {
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.5;
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .note-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    gap: 8px;
  }
  .note-foot-left { display: flex; align-items: center; gap: 8px; }
  .note-deadline {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .deadline-overdue { color: var(--urgent); font-weight: 600; }
  .deadline-soon { color: var(--warning); font-weight: 600; }
  .deadline-ok { color: var(--ink-3); }
  .note-meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
  }
  .note-att-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-2);
    background: var(--paper);
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .empty { text-align: center; padding: 80px 20px; color: var(--ink-3); }
  .empty-icon {
    font-family: var(--font-serif);
    font-size: 80px;
    font-style: italic;
    color: var(--line-2);
    line-height: 1;
    margin-bottom: 16px;
  }
  .empty-title {
    font-family: var(--font-serif);
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    font-size: 28px;
    box-shadow: var(--shadow-lg);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .fab:hover {
    background: var(--accent);
    transform: scale(1.05) rotate(90deg);
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(27, 37, 23, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--paper-2);
    border-radius: 4px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    border-top: 4px solid var(--ink);
  }
  .modal-title {
    font-family: var(--font-serif);
    font-size: 32px;
    margin-bottom: 24px;
    line-height: 1.1;
  }
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 6px;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--paper);
    border: 1px solid var(--line-2);
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    transition: border-color 0.15s;
  }
  .form-textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .modal-actions-right { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ATTACHMENTS */
  .att-zone {
    border: 1px dashed var(--line-2);
    border-radius: 2px;
    padding: 16px;
    background: var(--paper);
  }
  .att-input {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
    opacity: 0;
  }
  .att-upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--paper-2);
    border: 1px solid var(--line-2);
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-2);
    transition: all 0.15s;
  }
  .att-upload-btn:hover { border-color: var(--ink); color: var(--ink); }
  .att-hint {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 8px;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }
  .att-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .att-list-header {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 6px 0 2px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .att-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--paper-2);
    border: 1px solid var(--line-2);
    border-radius: 3px;
    font-size: 13px;
  }
  .att-row.is-new {
    border-color: var(--ok);
    background: #EAF1E1;
  }
  .att-thumb {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .att-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .att-thumb-icon {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-2);
    letter-spacing: 0.05em;
  }
  .att-info { flex: 1; min-width: 0; }
  .att-name {
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
  }
  .att-size {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 3px;
  }
  .att-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .att-action {
    background: var(--paper);
    border: 1px solid var(--line);
    cursor: pointer;
    padding: 0;
    width: 36px;
    height: 36px;
    color: var(--ink-2);
    font-size: 16px;
    border-radius: 3px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .att-action:hover, .att-action:active {
    color: var(--ink);
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .att-action.del:hover, .att-action.del:active {
    background: var(--urgent);
    border-color: var(--urgent);
    color: var(--paper);
  }

  /* QUICK PICKER */
  .picker-bg {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: none;
  }
  .picker-bg.show { display: block; }
  .picker {
    position: fixed;
    background: var(--paper-2);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    box-shadow: var(--shadow-lg);
    padding: 8px;
    min-width: 200px;
    max-width: 260px;
    z-index: 91;
  }
  .picker-title {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .picker-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    transition: background 0.1s;
  }
  .picker-item:hover { background: var(--paper); }
  .picker-item.active { background: var(--ink); color: var(--paper); }
  .picker-item-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* CATEGORY MANAGER */
  .cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .cat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2px;
  }
  .cat-row-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cat-row-name { flex: 1; font-size: 14px; }
  .cat-row-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
  }
  .cat-row-del {
    background: none;
    border: none;
    color: var(--ink-3);
    cursor: pointer;
    font-size: 18px;
    padding: 0 6px;
    line-height: 1;
  }
  .cat-row-del:hover { color: var(--urgent); }
  .cat-row.system .cat-row-name { color: var(--ink-3); }

  .add-cat-form {
    display: flex;
    gap: 8px;
    align-items: stretch;
    padding: 12px;
    background: var(--paper);
    border: 1px dashed var(--line-2);
    border-radius: 2px;
    margin-top: 12px;
  }
  .add-cat-form input {
    flex: 1;
    padding: 8px 10px;
    background: var(--paper-2);
    border: 1px solid var(--line-2);
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
  }
  .color-swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .color-swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: var(--ink); transform: scale(1.15); }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--ink-3);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .toast {
    position: fixed;
    bottom: 90px;
    right: 24px;
    background: var(--ink);
    color: var(--paper);
    padding: 12px 18px;
    border-radius: 2px;
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
    pointer-events: none;
    max-width: 80vw;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    .container { padding: 20px 16px 100px; }
    .brand-title { font-size: 40px; }
    .stats { gap: 16px; }
    .stat-num { font-size: 24px; }
    .notes { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .modal { padding: 24px 20px; }
    .header { border-bottom-width: 1px; }
  }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand">
      <div class="brand-eyebrow">Personal Workspace</div>
      <h1 class="brand-title">Bloc-<em>notes</em></h1>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-active">0</div>
        <div class="stat-label">Attive</div>
      </div>
      <div class="stat">
        <div class="stat-num urgent" id="stat-urgent">0</div>
        <div class="stat-label">Urgenti</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-completed">0</div>
        <div class="stat-label">Chiuse</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <input type="text" id="search" placeholder="Cerca per titolo, contenuto, categoria...">
    </div>
    <button class="btn btn-ghost" onclick="openCatManager()">⚙ Categorie</button>
    <button class="btn btn-ghost" onclick="exportExcel()">⤓ Excel</button>
  </div>

  <div class="filters" id="filters"></div>

  <div id="content">
    <div class="loading">Caricamento note…</div>
  </div>
</div>

<button class="fab" onclick="openModal()" title="Nuova nota">+</button>

<!-- NOTE MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 class="modal-title" id="modal-title">Nuova nota</h2>
    <input type="hidden" id="f-id">

    <div class="form-group">
      <label class="form-label">Titolo</label>
      <input type="text" class="form-input" id="f-title" placeholder="Titolo della nota..." maxlength="200">
    </div>

    <div class="form-group">
      <label class="form-label">Contenuto / dettagli</label>
      <textarea class="form-textarea" id="f-content" placeholder="Note, link, riferimenti, contesto..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-select" id="f-category"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Priorità</label>
        <select class="form-select" id="f-priority">
          <option value="3">⬤ Alta</option>
          <option value="2" selected>◐ Media</option>
          <option value="1">○ Bassa</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Scadenza (opzionale)</label>
      <input type="date" class="form-input" id="f-deadline">
    </div>

    <div class="form-group">
      <label class="form-label">Allegati</label>
      <div class="att-zone">
        <button type="button" class="att-upload-btn" onclick="document.getElementById('att-input').click()">
          ⤴ Carica file
        </button>
        <input type="file" class="att-input" id="att-input" multiple onchange="handleFileUpload(this.files)">
        <div class="att-hint">Max 3 MB per file · qualsiasi formato</div>
        <div class="att-list" id="att-list"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="btn-delete" onclick="deleteNote()" style="display:none; border-color:var(--urgent); color:var(--urgent)">Elimina</button>
      <div class="modal-actions-right" style="margin-left:auto">
        <button class="btn btn-ghost" id="btn-toggle" onclick="toggleComplete()" style="display:none">Segna chiusa</button>
        <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
        <button class="btn" onclick="saveNote()">Salva</button>
      </div>
    </div>
  </div>
</div>

<!-- CATEGORY MANAGER MODAL -->
<div class="modal-bg" id="cat-modal-bg" onclick="if(event.target===this)closeCatManager()">
  <div class="modal">
    <h2 class="modal-title">Gestisci categorie</h2>
    <p style="color:var(--ink-3); font-size:13px; margin-bottom:18px">
      Le categorie di sistema sono fisse. Puoi creare ed eliminare quelle custom.
    </p>

    <div id="cat-list" class="cat-list"></div>

    <div class="add-cat-form">
      <input type="text" id="new-cat-name" placeholder="Nome nuova categoria" maxlength="30">
      <button class="btn" onclick="addCustomCategory()">Aggiungi</button>
    </div>
    <div class="color-swatches" id="color-swatches"></div>

    <div class="modal-actions">
      <div class="modal-actions-right" style="margin-left:auto">
        <button class="btn" onclick="closeCatManager()">Chiudi</button>
      </div>
    </div>
  </div>
</div>

<!-- QUICK CATEGORY PICKER -->
<div class="picker-bg" id="picker-bg" onclick="closePicker()"></div>
<div class="picker" id="picker" style="display:none"></div>

<div class="toast" id="toast"></div>

<script>
  const NOTES_KEY = 'blocnotes_v2';
  const CATS_KEY = 'blocnotes_cats_v1';
  const ATT_PREFIX = 'att_';
  const MAX_FILE_SIZE = 3 * 1024 * 1024; // 3 MB

  const SYSTEM_CATEGORIES = [
    { id: 'lavoro',    label: 'Lavoro',    color: '#1F4068', system: true },
    { id: 'personale', label: 'Personale', color: '#B8860B', system: true },
    { id: 'viaggi',    label: 'Viaggi',    color: '#0F766E', system: true },
    { id: 'medical',   label: 'Medical',   color: '#8B2C0F', system: true }
  ];
  const UNCAT = { id: '_none', label: 'Senza categoria', color: '#8A8278', system: true, virtual: true };

  const CUSTOM_PALETTE = [
    '#5B21B6', '#BE185D', '#047857', '#B45309',
    '#4338CA', '#7C2D12', '#0369A1', '#86198F'
  ];

  let notes = [];
  let customCategories = [];
  let filterCat = 'all';
  let filterStatus = 'active';
  let sortBy = 'deadline';
  let searchQuery = '';
  let editingId = null;
  let selectedColor = CUSTOM_PALETTE[0];

  let modalAttachments = [];   // current state in modal
  let attachmentsToDelete = []; // existing ids to delete on save

  const PRIO_LABELS = { 3: '⬤', 2: '◐', 1: '○' };
  const PRIO_NAMES = { 3: 'Alta', 2: 'Media', 1: 'Bassa' };

  function allCategories() { return [...SYSTEM_CATEGORIES, ...customCategories]; }
  function findCategory(id) {
    if (!id || id === '_none') return UNCAT;
    return allCategories().find(c => c.id === id) || UNCAT;
  }

  // STORAGE - hybrid: window.storage in Claude.ai, localStorage when standalone
  const Storage = {
    hasClaudeStorage: (typeof window !== 'undefined') && window.storage &&
                       typeof window.storage.get === 'function',

    async get(key) {
      if (this.hasClaudeStorage) {
        try {
          const r = await window.storage.get(key);
          return r && r.value !== undefined ? r.value : null;
        } catch (e) { return null; }
      }
      try { return localStorage.getItem(key); } catch (e) { return null; }
    },

    async set(key, value) {
      if (this.hasClaudeStorage) {
        await window.storage.set(key, value);
        return;
      }
      try { localStorage.setItem(key, value); }
      catch (e) {
        if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
          throw new Error('Spazio storage esaurito');
        }
        throw e;
      }
    },

    async delete(key) {
      if (this.hasClaudeStorage) {
        try { await window.storage.delete(key); } catch (e) {}
        return;
      }
      try { localStorage.removeItem(key); } catch (e) {}
    }
  };

  async function loadAll() {
    try {
      const v = await Storage.get(NOTES_KEY);
      if (v) notes = JSON.parse(v);
    } catch (e) { notes = []; }
    try {
      const v = await Storage.get(CATS_KEY);
      if (v) customCategories = JSON.parse(v);
    } catch (e) { customCategories = []; }
    notes.forEach(n => { if (!Array.isArray(n.attachments)) n.attachments = []; });
    renderFilters();
    render();
    if (!Storage.hasClaudeStorage) {
      console.info('Bloc-notes: usando localStorage del browser (modalità standalone)');
    }
  }
  async function saveNotes() {
    try { await Storage.set(NOTES_KEY, JSON.stringify(notes)); }
    catch (e) { showToast('Errore salvataggio: ' + (e.message || e)); console.error(e); }
  }
  async function saveCats() {
    try { await Storage.set(CATS_KEY, JSON.stringify(customCategories)); }
    catch (e) { showToast('Errore salvataggio categorie'); console.error(e); }
  }
  async function saveAttachment(att) {
    try {
      await Storage.set(ATT_PREFIX + att.id, JSON.stringify({
        name: att.name, type: att.type, size: att.size, data: att.data
      }));
    } catch (e) { console.error('att save failed', e); throw e; }
  }
  async function loadAttachment(id) {
    try {
      const v = await Storage.get(ATT_PREFIX + id);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  }
  async function deleteAttachmentStorage(id) {
    try { await Storage.delete(ATT_PREFIX + id); }
    catch (e) { console.error('att delete failed', e); }
  }

  // HELPERS
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function slug(s) {
    return s.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
  }
  function fmtDateShort(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit' });
  }
  function daysUntil(iso) {
    if (!iso) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(iso); target.setHours(0,0,0,0);
    return Math.round((target - today) / 86400000);
  }
  function deadlineLabel(iso) {
    if (!iso) return '';
    const d = daysUntil(iso);
    if (d < 0) return `Scaduta · ${Math.abs(d)}g fa`;
    if (d === 0) return 'Oggi';
    if (d === 1) return 'Domani';
    if (d <= 7) return `Tra ${d}g · ${fmtDateShort(iso)}`;
    return fmtDate(iso);
  }
  function deadlineClass(iso) {
    if (!iso) return '';
    const d = daysUntil(iso);
    if (d <= 3) return 'deadline-overdue';
    if (d <= 7) return 'deadline-soon';
    return 'deadline-ok';
  }
  function isUrgent(note) {
    if (note.completed) return false;
    if (note.priority === 3) return true;
    if (note.deadline) {
      const d = daysUntil(note.deadline);
      if (d !== null && d <= 3) return true;
    }
    return false;
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastT);
    window._toastT = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/(1024*1024)).toFixed(2) + ' MB';
  }
  function fileExt(name) {
    const p = name.lastIndexOf('.');
    if (p < 0) return 'FILE';
    return name.slice(p+1).toUpperCase().slice(0, 4);
  }
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const result = r.result;
        const idx = result.indexOf(',');
        resolve(idx >= 0 ? result.slice(idx+1) : result);
      };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // FILTERS
  function renderFilters() {
    const cats = allCategories();
    const filters = document.getElementById('filters');
    filters.innerHTML = `
      <button class="chip ${filterCat==='all'?'active':''}" data-cat="all">Tutte</button>
      ${cats.map(c => `
        <button class="chip ${filterCat===c.id?'active':''}" data-cat="${c.id}">
          <span class="chip-dot" style="background:${c.color}"></span>${escapeHtml(c.label)}
        </button>
      `).join('')}
      <button class="chip ${filterCat==='_none'?'active':''}" data-cat="_none">
        <span class="chip-dot" style="background:${UNCAT.color}; opacity:0.5"></span>Senza categoria
      </button>
      <button class="chip chip-add" onclick="openCatManager(true)">+ Categoria</button>
      <div class="filters-divider"></div>
      <button class="chip ${filterStatus==='active'?'active':''}" data-status="active">Attive</button>
      <button class="chip ${filterStatus==='completed'?'active':''}" data-status="completed">Chiuse</button>
      <button class="chip ${filterStatus==='all'?'active':''}" data-status="all">Tutte</button>
      <div class="filters-divider"></div>
      <button class="chip ${sortBy==='deadline'?'active':''}" data-sort="deadline">↕ Scadenza</button>
      <button class="chip ${sortBy==='created'?'active':''}" data-sort="created">↕ Recenti</button>
      <button class="chip ${sortBy==='priority'?'active':''}" data-sort="priority">↕ Priorità</button>
    `;
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip || chip.classList.contains('chip-add')) return;
    if (chip.dataset.cat) filterCat = chip.dataset.cat;
    else if (chip.dataset.status) filterStatus = chip.dataset.status;
    else if (chip.dataset.sort) sortBy = chip.dataset.sort;
    renderFilters();
    render();
  });

  document.getElementById('search').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    render();
  });

  // RENDER
  function getFilteredNotes() {
    let list = [...notes];
    if (filterCat === '_none') list = list.filter(n => !n.category);
    else if (filterCat !== 'all') list = list.filter(n => n.category === filterCat);
    if (filterStatus === 'active') list = list.filter(n => !n.completed);
    else if (filterStatus === 'completed') list = list.filter(n => n.completed);
    if (searchQuery) {
      list = list.filter(n => {
        const cat = findCategory(n.category);
        return n.title.toLowerCase().includes(searchQuery) ||
          (n.content || '').toLowerCase().includes(searchQuery) ||
          cat.label.toLowerCase().includes(searchQuery);
      });
    }
    if (sortBy === 'deadline') {
      list.sort((a, b) => {
        if (!a.deadline && !b.deadline) return b.created - a.created;
        if (!a.deadline) return 1;
        if (!b.deadline) return -1;
        return new Date(a.deadline) - new Date(b.deadline);
      });
    } else if (sortBy === 'created') {
      list.sort((a, b) => b.created - a.created);
    } else if (sortBy === 'priority') {
      list.sort((a, b) => b.priority - a.priority || (b.created - a.created));
    }
    return list;
  }

  function render() {
    const active = notes.filter(n => !n.completed).length;
    const urgent = notes.filter(n => !n.completed && isUrgent(n)).length;
    const completed = notes.filter(n => n.completed).length;
    document.getElementById('stat-active').textContent = active;
    document.getElementById('stat-urgent').textContent = urgent;
    document.getElementById('stat-completed').textContent = completed;

    const list = getFilteredNotes();
    const container = document.getElementById('content');

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">∅</div>
          <div class="empty-title">${notes.length === 0 ? 'Nessuna nota' : 'Nessun risultato'}</div>
          <div>${notes.length === 0 ? 'Tocca + per crearne una' : 'Prova a modificare i filtri'}</div>
        </div>
      `;
      return;
    }

    container.innerHTML = '<div class="notes">' + list.map(n => {
      const cat = findCategory(n.category);
      const attCount = (n.attachments || []).length;
      return `
        <div class="note ${n.completed ? 'completed' : ''} ${isUrgent(n) ? 'urgent' : ''}"
             style="border-left-color:${isUrgent(n) ? 'var(--urgent)' : cat.color}"
             onclick="editNote('${n.id}')">
          <div class="note-head">
            <div class="note-cat" style="color:${cat.color}"
                 onclick="event.stopPropagation(); openPicker(event, '${n.id}')"
                 title="Cambia categoria">${escapeHtml(cat.label)}</div>
            <div class="note-priority" title="${PRIO_NAMES[n.priority]}">${PRIO_LABELS[n.priority]}</div>
          </div>
          <div class="note-title">${escapeHtml(n.title)}</div>
          ${n.content ? `<div class="note-content">${escapeHtml(n.content)}</div>` : '<div class="note-content" style="color:var(--ink-3); font-style:italic">— senza contenuto —</div>'}
          <div class="note-foot">
            <div class="note-foot-left">
              ${n.deadline ? `<div class="note-deadline ${deadlineClass(n.deadline)}">⏱ ${deadlineLabel(n.deadline)}</div>` : '<div class="note-deadline deadline-ok">—</div>'}
              ${attCount > 0 ? `<div class="note-att-badge" title="${attCount} allegat${attCount===1?'o':'i'}">⎙ ${attCount}</div>` : ''}
            </div>
            <div class="note-meta">${fmtDateShort(new Date(n.created).toISOString())}</div>
          </div>
        </div>
      `;
    }).join('') + '</div>';
  }

  // QUICK PICKER
  let pickerNoteId = null;
  function openPicker(event, noteId) {
    pickerNoteId = noteId;
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    const picker = document.getElementById('picker');
    const cats = [...allCategories(), UNCAT];
    picker.innerHTML = `
      <div class="picker-title">Cambia categoria</div>
      ${cats.map(c => `
        <div class="picker-item ${(note.category || '_none')===c.id ? 'active' : ''}"
             onclick="quickChangeCategory('${c.id}')">
          <span class="picker-item-dot" style="background:${c.color}; ${c.id==='_none'?'opacity:0.5':''}"></span>
          <span>${escapeHtml(c.label)}</span>
        </div>
      `).join('')}
    `;
    const rect = event.target.getBoundingClientRect();
    picker.style.display = 'block';
    const pickerRect = picker.getBoundingClientRect();
    let left = rect.left;
    let top = rect.bottom + 6;
    if (left + pickerRect.width > window.innerWidth - 16) {
      left = window.innerWidth - pickerRect.width - 16;
    }
    if (top + pickerRect.height > window.innerHeight - 16) {
      top = rect.top - pickerRect.height - 6;
    }
    picker.style.left = Math.max(8, left) + 'px';
    picker.style.top = Math.max(8, top) + 'px';
    document.getElementById('picker-bg').classList.add('show');
  }

  function closePicker() {
    document.getElementById('picker-bg').classList.remove('show');
    document.getElementById('picker').style.display = 'none';
    pickerNoteId = null;
  }

  async function quickChangeCategory(catId) {
    if (!pickerNoteId) return;
    const i = notes.findIndex(n => n.id === pickerNoteId);
    if (i < 0) return;
    notes[i].category = catId === '_none' ? null : catId;
    notes[i].modified = Date.now();
    await saveNotes();
    closePicker();
    render();
    showToast('Categoria aggiornata');
  }

  // NOTE MODAL
  function fillCategorySelect(selected) {
    const sel = document.getElementById('f-category');
    const all = allCategories();
    sel.innerHTML = `
      <option value="_none" ${!selected || selected==='_none' ? 'selected' : ''}>— Senza categoria —</option>
      ${all.map(c => `<option value="${c.id}" ${c.id===selected?'selected':''}>${escapeHtml(c.label)}</option>`).join('')}
    `;
  }

  function openModal(note = null) {
    const m = document.getElementById('modal-bg');
    modalAttachments = [];
    attachmentsToDelete = [];
    if (note) {
      editingId = note.id;
      document.getElementById('modal-title').textContent = 'Modifica nota';
      document.getElementById('f-id').value = note.id;
      document.getElementById('f-title').value = note.title;
      document.getElementById('f-content').value = note.content || '';
      fillCategorySelect(note.category || '_none');
      document.getElementById('f-priority').value = note.priority;
      document.getElementById('f-deadline').value = note.deadline || '';
      document.getElementById('btn-delete').style.display = 'inline-block';
      document.getElementById('btn-toggle').style.display = 'inline-block';
      document.getElementById('btn-toggle').textContent = note.completed ? 'Riapri' : 'Segna chiusa';
      modalAttachments = (note.attachments || []).map(a => ({ ...a }));
    } else {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Nuova nota';
      document.getElementById('f-id').value = '';
      document.getElementById('f-title').value = '';
      document.getElementById('f-content').value = '';
      fillCategorySelect('_none');
      document.getElementById('f-priority').value = '2';
      document.getElementById('f-deadline').value = '';
      document.getElementById('btn-delete').style.display = 'none';
      document.getElementById('btn-toggle').style.display = 'none';
    }
    renderAttachmentList();
    m.classList.add('show');
    setTimeout(() => document.getElementById('f-title').focus(), 50);
  }

  function closeModal() {
    document.getElementById('modal-bg').classList.remove('show');
    editingId = null;
    modalAttachments = [];
    attachmentsToDelete = [];
    document.getElementById('att-input').value = '';
  }

  function editNote(id) {
    const n = notes.find(x => x.id === id);
    if (n) openModal(n);
  }

  // ATTACHMENTS
  async function handleFileUpload(fileList) {
    const files = Array.from(fileList);
    for (const f of files) {
      if (f.size > MAX_FILE_SIZE) {
        showToast(`"${f.name}" supera 3 MB e non sarà aggiunto`);
        continue;
      }
      try {
        const data = await fileToBase64(f);
        const att = {
          id: uid(),
          name: f.name,
          type: f.type || 'application/octet-stream',
          size: f.size,
          _newData: data
        };
        if (f.type && f.type.startsWith('image/')) {
          att._previewUrl = `data:${f.type};base64,${data}`;
        }
        modalAttachments.push(att);
      } catch (e) {
        showToast(`Errore lettura "${f.name}"`);
      }
    }
    document.getElementById('att-input').value = '';
    renderAttachmentList();
  }

  async function renderAttachmentList() {
    const list = document.getElementById('att-list');
    if (modalAttachments.length === 0) {
      list.innerHTML = '';
      return;
    }
    list.innerHTML = `
      <div class="att-list-header">${modalAttachments.length} allegat${modalAttachments.length===1?'o':'i'}</div>
      ${modalAttachments.map((a, idx) => `
        <div class="att-row ${a._newData ? 'is-new' : ''}">
          <div class="att-thumb" id="thumb-${a.id}">
            ${a._previewUrl ? `<img src="${a._previewUrl}" alt="">` :
              `<span class="att-thumb-icon">${fileExt(a.name)}</span>`}
          </div>
          <div class="att-info">
            <div class="att-name" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</div>
            <div class="att-size">${fmtSize(a.size)}${a._newData ? ' · nuovo' : ''}</div>
          </div>
          <div class="att-actions">
            <button class="att-action" onclick="openModalAttachment(${idx})" title="Apri">⎋</button>
            <button class="att-action" onclick="downloadModalAttachment(${idx})" title="Scarica">⤓</button>
            <button class="att-action del" onclick="removeModalAttachment(${idx})" title="Rimuovi">×</button>
          </div>
        </div>
      `).join('')}
    `;

    // Lazy-load preview thumbnails for image attachments not yet rendered
    for (const a of modalAttachments) {
      if (!a._previewUrl && a.type && a.type.startsWith('image/')) {
        const stored = await loadAttachment(a.id);
        if (stored) {
          a._previewUrl = `data:${stored.type};base64,${stored.data}`;
          const thumb = document.getElementById('thumb-' + a.id);
          if (thumb) thumb.innerHTML = `<img src="${a._previewUrl}" alt="">`;
        }
      }
    }
  }

  // Convert base64 string to Blob — more reliable than data: URLs on mobile
  function base64ToBlob(base64, mimeType) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
      byteNumbers[i] = byteChars.charCodeAt(i);
    }
    return new Blob([new Uint8Array(byteNumbers)], { type: mimeType || 'application/octet-stream' });
  }

  async function getAttachmentData(idx) {
    const a = modalAttachments[idx];
    if (!a) return null;
    if (a._newData) return { att: a, data: a._newData };
    const stored = await loadAttachment(a.id);
    if (!stored) return null;
    return { att: a, data: stored.data };
  }

  async function downloadModalAttachment(idx) {
    const r = await getAttachmentData(idx);
    if (!r) { showToast('Allegato non trovato'); return; }
    try {
      const blob = base64ToBlob(r.data, r.att.type);
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = r.att.name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('Download avviato');
    } catch (e) {
      showToast('Errore download: ' + (e.message || e));
    }
  }

  async function openModalAttachment(idx) {
    const r = await getAttachmentData(idx);
    if (!r) { showToast('Allegato non trovato'); return; }
    try {
      const blob = base64ToBlob(r.data, r.att.type);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (e) {
      showToast('Errore apertura: ' + (e.message || e));
    }
  }

  function removeModalAttachment(idx) {
    const a = modalAttachments[idx];
    if (!a) return;
    if (!a._newData) attachmentsToDelete.push(a.id);
    modalAttachments.splice(idx, 1);
    renderAttachmentList();
  }

  async function saveNote() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { showToast('Titolo obbligatorio'); return; }

    const catVal = document.getElementById('f-category').value;
    const data = {
      title,
      content: document.getElementById('f-content').value.trim(),
      category: catVal === '_none' ? null : catVal,
      priority: parseInt(document.getElementById('f-priority').value),
      deadline: document.getElementById('f-deadline').value || null
    };

    try {
      for (const a of modalAttachments) {
        if (a._newData) {
          await saveAttachment({
            id: a.id, name: a.name, type: a.type, size: a.size, data: a._newData
          });
        }
      }
      for (const id of attachmentsToDelete) {
        await deleteAttachmentStorage(id);
      }
    } catch (e) {
      showToast('Errore salvataggio allegati');
      return;
    }

    const cleanAttachments = modalAttachments.map(a => ({
      id: a.id, name: a.name, type: a.type, size: a.size
    }));

    if (editingId) {
      const i = notes.findIndex(n => n.id === editingId);
      if (i >= 0) notes[i] = {
        ...notes[i], ...data,
        attachments: cleanAttachments,
        modified: Date.now()
      };
      showToast('Nota aggiornata');
    } else {
      notes.unshift({
        id: uid(),
        ...data,
        attachments: cleanAttachments,
        completed: false,
        created: Date.now(),
        modified: Date.now()
      });
      showToast('Nota creata');
    }
    await saveNotes();
    closeModal();
    render();
  }

  async function deleteNote() {
    if (!editingId) return;
    if (!confirm('Eliminare questa nota e tutti i suoi allegati?')) return;
    const note = notes.find(n => n.id === editingId);
    if (note && note.attachments) {
      for (const a of note.attachments) await deleteAttachmentStorage(a.id);
    }
    notes = notes.filter(n => n.id !== editingId);
    await saveNotes();
    closeModal();
    render();
    showToast('Nota eliminata');
  }

  async function toggleComplete() {
    if (!editingId) return;
    const i = notes.findIndex(n => n.id === editingId);
    if (i < 0) return;
    notes[i].completed = !notes[i].completed;
    notes[i].modified = Date.now();
    await saveNotes();
    closeModal();
    render();
    showToast(notes[i].completed ? 'Nota chiusa' : 'Nota riaperta');
  }

  // CATEGORY MANAGER
  function openCatManager(focusInput = false) {
    renderCatManager();
    document.getElementById('cat-modal-bg').classList.add('show');
    if (focusInput) {
      setTimeout(() => document.getElementById('new-cat-name').focus(), 50);
    }
  }
  function closeCatManager() {
    document.getElementById('cat-modal-bg').classList.remove('show');
  }
  function renderCatManager() {
    const list = document.getElementById('cat-list');
    const counts = {};
    notes.forEach(n => { counts[n.category || '_none'] = (counts[n.category || '_none'] || 0) + 1; });

    list.innerHTML = allCategories().map(c => `
      <div class="cat-row ${c.system ? 'system' : ''}">
        <span class="cat-row-dot" style="background:${c.color}"></span>
        <span class="cat-row-name">${escapeHtml(c.label)}${c.system ? ' <span style="font-size:10px; color:var(--ink-3); margin-left:6px">SISTEMA</span>' : ''}</span>
        <span class="cat-row-meta">${counts[c.id] || 0} note</span>
        ${c.system ? '' : `<button class="cat-row-del" onclick="deleteCustomCategory('${c.id}')" title="Elimina">×</button>`}
      </div>
    `).join('');

    const swatches = document.getElementById('color-swatches');
    swatches.innerHTML = CUSTOM_PALETTE.map(col => `
      <div class="color-swatch ${col === selectedColor ? 'selected' : ''}"
           style="background:${col}"
           onclick="selectColor('${col}')"></div>
    `).join('');
  }
  function selectColor(col) {
    selectedColor = col;
    renderCatManager();
  }
  async function addCustomCategory() {
    const name = document.getElementById('new-cat-name').value.trim();
    if (!name) { showToast('Inserisci un nome'); return; }
    if (name.length < 2) { showToast('Nome troppo corto'); return; }

    let id = slug(name);
    if (!id) id = 'custom-' + uid().slice(0, 5);
    if (allCategories().some(c => c.id === id) || id === '_none') {
      showToast('Categoria già esistente');
      return;
    }

    customCategories.push({
      id, label: name, color: selectedColor, system: false
    });
    await saveCats();
    document.getElementById('new-cat-name').value = '';
    const idx = CUSTOM_PALETTE.indexOf(selectedColor);
    selectedColor = CUSTOM_PALETTE[(idx + 1) % CUSTOM_PALETTE.length];
    renderCatManager();
    renderFilters();
    showToast('Categoria creata');
  }

  async function deleteCustomCategory(id) {
    const cat = customCategories.find(c => c.id === id);
    if (!cat) return;
    const count = notes.filter(n => n.category === id).length;
    let msg = `Eliminare la categoria "${cat.label}"?`;
    if (count > 0) msg += `\n\n${count} note resteranno senza categoria.`;
    if (!confirm(msg)) return;

    if (count > 0) {
      notes = notes.map(n => n.category === id ? { ...n, category: null, modified: Date.now() } : n);
      await saveNotes();
    }
    customCategories = customCategories.filter(c => c.id !== id);
    await saveCats();

    if (filterCat === id) filterCat = 'all';
    renderCatManager();
    renderFilters();
    render();
    showToast('Categoria eliminata');
  }

  // EXPORT - lazy-loads XLSX library on demand, falls back to CSV if offline
  function loadXLSX() {
    return new Promise((resolve, reject) => {
      if (typeof XLSX !== 'undefined') return resolve();
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('XLSX non disponibile'));
      document.head.appendChild(s);
      setTimeout(() => reject(new Error('XLSX timeout')), 8000);
    });
  }

  function exportCSV(rows) {
    if (rows.length === 0) return;
    const headers = Object.keys(rows[0]);
    const escape = v => {
      if (v == null) return '';
      const s = String(v);
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const csv = [
      headers.join(';'),
      ...rows.map(r => headers.map(h => escape(r[h])).join(';'))
    ].join('\n');
    // BOM for proper UTF-8 in Excel
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const today = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Bloc-notes_${today}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function exportExcel() {
    if (notes.length === 0) { showToast('Nessuna nota da esportare'); return; }
    const rows = notes.map(n => ({
      'Titolo': n.title,
      'Contenuto': n.content || '',
      'Categoria': findCategory(n.category).label,
      'Priorità': PRIO_NAMES[n.priority],
      'Scadenza': n.deadline ? fmtDate(n.deadline) : '',
      'Giorni a scadenza': n.deadline ? daysUntil(n.deadline) : '',
      'Allegati': (n.attachments || []).length,
      'Stato': n.completed ? 'Chiusa' : 'Attiva',
      'Creata': new Date(n.created).toLocaleString('it-IT'),
      'Modificata': new Date(n.modified || n.created).toLocaleString('it-IT')
    }));

    showToast('Esportazione in corso…');
    try {
      await loadXLSX();
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [
        { wch: 35 }, { wch: 50 }, { wch: 16 }, { wch: 10 },
        { wch: 16 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 18 }, { wch: 18 }
      ];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Bloc-notes');
      const today = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `Bloc-notes_${today}.xlsx`);
      showToast('Excel esportato');
    } catch (e) {
      // Fallback: CSV (works offline, opens in Excel)
      exportCSV(rows);
      showToast('CSV esportato (Excel non disponibile offline)');
    }
  }

  // KEYBOARD
  document.addEventListener('keydown', (e) => {
    const noteOpen = document.getElementById('modal-bg').classList.contains('show');
    const catOpen = document.getElementById('cat-modal-bg').classList.contains('show');
    const pickerOpen = document.getElementById('picker-bg').classList.contains('show');
    if (e.key === 'Escape') {
      if (pickerOpen) closePicker();
      else if (noteOpen) closeModal();
      else if (catOpen) closeCatManager();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && noteOpen) saveNote();
    if (e.key === 'n' && !noteOpen && !catOpen && !pickerOpen &&
        document.activeElement.tagName !== 'INPUT' &&
        document.activeElement.tagName !== 'TEXTAREA') {
      openModal();
    }
  });

  document.getElementById('new-cat-name').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCustomCategory();
  });

  // Visible error handler — if anything goes wrong, show it instead of blank page
  window.addEventListener('error', (e) => {
    const c = document.getElementById('content');
    if (c && c.querySelector('.loading')) {
      c.innerHTML = `
        <div class="empty">
          <div class="empty-icon">!</div>
          <div class="empty-title">Errore di caricamento</div>
          <div style="margin-top:8px; font-family:var(--font-mono); font-size:11px;">
            ${(e.message || 'Errore sconosciuto').replace(/[<>]/g, '')}
          </div>
        </div>`;
    }
  });

  loadAll().catch(err => {
    console.error('init failed', err);
    showToast('Errore inizializzazione: ' + (err.message || err));
  });

  // Register service worker for PWA / offline capability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('SW registration failed', err);
      });
    });
  }
</script>

</body>
